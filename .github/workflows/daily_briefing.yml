name: Briefing Famiglia Casa Barra

on:
  schedule:
    # 1. Ogni mattina alle 07:30 (Lun-Ven) o 09:00 (Sab-Dom) ora italiana (gestito con UTC considerando solare/legale)
    - cron: '30 6 * * 1-5'
    - cron: '0 8 * * 0,6'
    # 2. Ogni sera alle 20:00 ora italiana (19:00 UTC in inverno / 18:00 UTC in estate, impostiamo le 18:00 UTC o facciamo scattare lo script che decide)
    - cron: '0 18 * * *'
  workflow_dispatch: # Per il test manuale con 1 click

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Invia Briefing su Telegram
        env:
          DBX_APP_KEY: ${{ secrets.DBX_APP_KEY }}
          DBX_APP_SECRET: ${{ secrets.DBX_APP_SECRET }}
          DBX_REFRESH_TOKEN: ${{ secrets.DBX_REFRESH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python morning_briefing.py
